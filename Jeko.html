<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Fuel Station Sales System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>سیستەمێ وێستگەیا سوتەمەنیێ</h2>
    
    <div class="form-group">
        <label>جۆرێ سوتەمەنیێ:</label>
        <select id="fuelType">
            <option value="900">بنزین نۆرماڵ (900 دینار)</option>
            <option value="1100">بنزین موحەسەن (1100 دینار)</option>
            <option value="1250">بنزین سوپەر (1250 دینار)</option>
            <option value="800">گازوایل (800 دینار)</option>
        </select>
    </div>

    <div class="form-group">
        <label>چەند لیتر؟</label>
        <input type="number" id="liters" placeholder="ژمارا لیتران بنڤیسە" min="1">
    </div>

    <button onclick="calculateSale()">حساب بکە</button>

    <div class="result" id="totalOutput">
        کۆمێ گشتی: 0 دینار
    </div>
</div>

<script>
    function calculateSale() {
        let price = document.getElementById('fuelType').value;
        let liters = document.getElementById('liters').value;
        
        if(liters > 0) {
            let total = price * liters;
            document.getElementById('totalOutput').innerText = "کۆمێ گشتی: " + total.toLocaleString() + " دینار";
        } else {
            alert("تکایە ژمارەکا درست یا لیتران بنڤیسە");
        }
    }
</script>

</body>
</html>
